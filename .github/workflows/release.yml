name: release

# Publishing to PyPI is irreversible: a version number, once uploaded, can never be
# reused even if the file is deleted. Everything before the publish job exists to make
# sure the thing being uploaded is the thing that was reviewed.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match the packaged version
        # The tag names the release a human clicked; pyproject.toml names what PyPI will
        # serve forever. A silent disagreement between them is the one mistake that
        # cannot be taken back, so it is checked before anything is built.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          printf 'tag=%s pyproject=%s\n' "$tag" "$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::release tag and pyproject.toml version disagree"; exit 1; }

      - name: Version must not already exist on PyPI
        # gh-action-pypi-publish would fail on a duplicate anyway, but it fails after the
        # build and inside the job that holds the publishing token. Failing here keeps the
        # rejection away from the step that can write.
        run: |
          name="$(python -c 'import tomllib,pathlib;print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["name"])')"
          ver="${GITHUB_REF_NAME#v}"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$ver/json")"
          [ "$code" = "404" ] || { echo "::error::$name $ver already exists on PyPI (HTTP $code)"; exit 1; }

      - name: Build sdist and wheel
        run: python -m pip install --upgrade pip build twine && python -m build

      - name: Check the artifacts render on PyPI
        run: python -m twine check --strict dist/*

      - name: Check metadata and contents
        # This package forwards to saihm-adapters and ships no code. Check that the built
        # files say so, depend on saihm-adapters, and link only to the hosts listed here.
        run: |
          python - <<'PY'
          import pathlib, re, sys, tarfile, zipfile
          from urllib.parse import unquote, urlsplit
          # A path is allowed when it equals an entry or continues it after a "/", so lookalikes
          # such as x.com/SAIHMemoryFake fail ("" admits the whole host).
          ALLOWED = {
              "saihm.net": ("",),
              "saihm-admin.github.io": ("",),
              "github.com": ("/SAIHM-Admin", "/sponsors/SAIHM-Admin"),
              "img.shields.io": ("/pypi", "/badge"),
              "x.com": ("/SAIHMemory",),
              "www.youtube.com": ("/@SAIHM-Memory",),
              "pypi.org": ("/project/saihm-adapters", "/project/saihm-langgraph", "/project/saihm-crewai", "/project/mcp"),
              "www.apache.org": ("/licenses",),
          }

          def allowed(url):
              # The authority as written may hold no backslash and no "@" (a browser and urlsplit
              # can then disagree on the host), and no path segment may be "." or "..", also
              # percent-encoded.
              authority = url.split("://", 1)[-1].split("/", 1)[0]
              if "\\" in authority or "@" in authority:
                  return False
              u = urlsplit(url)
              path = u.path or "/"
              if any(unquote(s) in (".", "..") for s in path.split("/")):
                  return False
              return any(path == p or path.startswith(p + "/") for p in ALLOWED.get(u.hostname or "", ()))

          # Negative and positive controls: the check must reject lookalikes and admit the real links.
          for bad in ("https://x.com/SAIHMemoryFake", "https://x.com/elonmusk",
                      "https://github.com/sponsors/SAIHM-AdminX", "https://github.com/sponsors/SAIHM-Admin-evil",
                      "https://github.com/SAIHM-AdminX/repo", "https://www.youtube.com/@SAIHM-Memory-Fake",
                      "https://img.shields.io/pypifake/x", "https://saihm.net.example.com/",
                      "https://github.com/SAIHM-Admin/../evil/repo", "https://x.com/SAIHMemory/../elonmusk",
                      "https://www.youtube.com/@SAIHM-Memory/../@other", "https://img.shields.io/badge/../../evil",
                      "https://x.com/SAIHMemory/%2e%2e/elonmusk", "https://evil.example\\@saihm.net/",
                      "https://someone@saihm.net/", "https://pypi.org/project/saihm-adapterz/",
                      "https://pypi.org/project/evil/"):
              assert not allowed(bad), f"allowlist admits a lookalike: {bad}"
          for good in ("https://x.com/SAIHMemory", "https://github.com/sponsors/SAIHM-Admin",
                       "https://www.youtube.com/@SAIHM-Memory?sub_confirmation=1",
                       "https://github.com/SAIHM-Admin/saihm-adapters", "https://img.shields.io/pypi/v/x.svg",
                       "https://pypi.org/project/saihm-adapters/", "https://pypi.org/project/mcp/"):
              assert allowed(good), f"allowlist rejects a real link: {good}"
          dist = sorted(pathlib.Path("dist").iterdir())
          wheels = [p for p in dist if p.suffix == ".whl"]
          sdists = [p for p in dist if p.name.endswith(".tar.gz")]
          assert len(wheels) == 1 and len(sdists) == 1, dist
          url = re.compile(rb"https?://[^\s<>\"')\]`]+")
          errors = []

          def check_links(where, data):
              for raw in url.findall(data):
                  link = raw.decode("utf-8", "replace").rstrip(".,;:")
                  if not allowed(link):
                      errors.append(f"link outside the allowlist in {where}: {link}")

          with zipfile.ZipFile(wheels[0]) as z:
              names = z.namelist()
              code = [n for n in names if ".dist-info/" not in n]
              if code:
                  errors.append(f"wheel ships files outside dist-info: {code}")
              meta = next(z.read(n) for n in names if n.endswith(".dist-info/METADATA"))
              if not re.search(rb"^Requires-Dist: saihm-adapters\[", meta, re.M):
                  errors.append("wheel METADATA does not require saihm-adapters")
              for n in names:
                  check_links(f"wheel {n}", z.read(n))
          with tarfile.open(sdists[0]) as t:
              for m in t.getmembers():
                  if m.isfile():
                      check_links(f"sdist {m.name}", t.extractfile(m).read())
          print("\n".join(errors) or "ok: forwarder metadata and contents")
          sys.exit(1 if errors else 0)
          PY

      - name: Dependencies must resolve on PyPI
        # The forwarder requires a saihm-adapters release. Stop here until that release is
        # live, so this package never reaches PyPI pointing at a version nobody can install.
        run: python -m pip install --dry-run --quiet dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Named so a required reviewer can be attached to the irreversible step without
    # touching this file. PyPI's trusted publisher must name the same environment.
    environment: pypi
    permissions:
      # A job-level block replaces the top-level one, so read access is restated here
      # rather than inherited.
      contents: read
      # The only job that mints an identity token, and it mints nothing else.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Trusted publishing: the token is exchanged for a short-lived PyPI credential
      # scoped to this repository and workflow. No API token is stored anywhere.
      - uses: pypa/gh-action-pypi-publish@release/v1
