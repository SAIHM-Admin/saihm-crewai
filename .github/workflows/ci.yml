name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the tree. No token is minted for anything else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Node is required at runtime: the bundled sidecar seals every cell client-side.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        # First test provisions the sidecar (npm ci) into the cache, then runs against the
        # offline blind sandbox — no account, no live endpoint.
        run: python -m pytest -q
