[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saihm-crewai"
version = "0.1.3"
description = "Compatibility shim — saihm-crewai is now the consolidated saihm-adapters[crewai]. Import from saihm_adapters (was saihm_memory)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "SAIHM" }]
keywords = ["crewai", "agent-memory", "external-memory", "mcp", "saihm", "encryption", "gdpr", "memory", "enterprise"]
dependencies = [
    # Consolidated adapter package. It carries the mcp + crewai pins;
    # this metapackage ships zero Python modules of its own.
    "saihm-adapters[crewai]>=0.1.3,<0.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://saihm.net"
Documentation = "https://github.com/SAIHM-Admin/saihm-adapters#readme"
Source = "https://github.com/SAIHM-Admin/saihm-crewai"
Issues = "https://github.com/SAIHM-Admin/saihm-adapters/issues"
Changelog = "https://github.com/SAIHM-Admin/saihm-crewai/blob/main/CHANGELOG.md"
Demos = "https://saihm-admin.github.io/saihm-demos/"

# Pure metapackage: ship no packages and no top-level modules.
# top_level.txt is empty; this dist owns no import root.
[tool.setuptools]
packages = []
py-modules = []
